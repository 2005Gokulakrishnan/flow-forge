<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FlowForge — Mini Make</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--border:#e4e7ec;--text:#182230;--muted:#667085;--accent:#6d5dfc;--accent2:#5146e5;--green:#12b76a;--red:#f04438;--shadow:0 8px 24px rgba(16,24,40,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#101828;color:#fff;padding:18px 14px;display:flex;flex-direction:column}.brand{font-weight:700;font-size:20px;padding:8px 10px 22px}.brand span{color:#9b8cff}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8cdd5;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}.side-bottom{margin-top:auto;font-size:12px;color:#98a2b3;padding:10px}.main{display:grid;grid-template-rows:64px 1fr;min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.title{font-size:16px;font-weight:600}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:#344054}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:hover{filter:brightness(.98)}.workspace{display:grid;grid-template-columns:1fr 310px;min-height:0}.canvas-wrap{position:relative;overflow:auto;background-color:#fafbff;background-image:radial-gradient(#d8dce7 1px,transparent 1px);background-size:22px 22px}.canvas{position:relative;width:1800px;height:1100px}.node{position:absolute;width:210px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);cursor:move;z-index:3}.node.selected{border:2px solid var(--accent)}.node-head{display:flex;align-items:center;gap:9px;padding:12px;border-bottom:1px solid #eef0f4}.icon{width:30px;height:30px;border-radius:8px;background:#f0edff;color:var(--accent2);display:grid;place-items:center;font-weight:700}.node-title{font-size:13px;font-weight:700}.node-type{font-size:11px;color:var(--muted);margin-top:2px}.node-body{padding:10px 12px;color:var(--muted);font-size:11px;line-height:1.5}.port{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent);top:50%;transform:translateY(-50%);cursor:crosshair}.port.in{left:-6px}.port.out{right:-6px}.connection{position:absolute;height:2px;background:#8f86ff;transform-origin:left center;z-index:1;pointer-events:none}.panel{background:#fff;border-left:1px solid var(--border);padding:18px;overflow:auto}.panel h3{font-size:14px;margin:0 0 14px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:600;color:#475467;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px;font:inherit;font-size:12px}.field textarea{min-height:90px;resize:vertical}.hint{font-size:11px;color:var(--muted);line-height:1.5}.log{margin-top:20px}.log-item{border:1px solid var(--border);border-radius:8px;padding:9px;margin:7px 0;font-size:11px}.ok{color:var(--green)}.err{color:var(--red)}.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;right:24px;bottom:24px;background:#101828;color:#fff;padding:11px 14px;border-radius:8px;font-size:12px;display:none;z-index:10}.toolbar{position:absolute;left:16px;top:16px;z-index:5;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:6px;display:flex;gap:5px}.toolbar button{border:0;background:#fff;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px}.toolbar button:hover{background:#f2f4f7}.status{font-size:11px;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.workspace{grid-template-columns:1fr 260px}.sidebar{padding:10px 8px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">Flow<span>Forge</span></div><div class="nav"><button class="active">▦ Scenarios</button><button>◈ Templates</button><button>◌ Connections</button><button>▤ Executions</button><button>⚙ Settings</button></div><div class="side-bottom">Educational Mini Make<br>Local-first demo • v1.0</div></aside>
<main class="main"><header class="topbar"><div><div class="title" id="scenarioName">Lead Automation</div><div class="status" id="status">Draft • local browser storage</div></div><div class="actions"><button class="btn" id="newBtn">New</button><button class="btn" id="saveBtn">Save</button><button class="btn primary" id="runBtn">▶ Run once</button></div></header>
<section class="workspace"><div class="canvas-wrap" id="canvasWrap"><div class="toolbar"><button data-add="webhook">＋ Webhook</button><button data-add="filter">＋ Filter</button><button data-add="sheets">＋ Sheets</button><button data-add="email">＋ Email</button><button data-add="http">＋ HTTP</button></div><div class="canvas" id="canvas"><svg id="svg" width="1800" height="1100" style="position:absolute;inset:0;z-index:0;overflow:visible"></svg></div></div><aside class="panel"><h3>Module configuration</h3><div id="inspector" class="empty">Select a module to configure it.</div><div class="log"><h3>Execution log</h3><div id="logs"><div class="empty">No executions yet.</div></div></div></aside></section></main></div><div class="toast" id="toast"></div>
<script>
const canvas=document.getElementById('canvas'), svg=document.getElementById('svg'), inspector=document.getElementById('inspector'), logs=document.getElementById('logs');
let nodes=[], edges=[], selected=null, dragging=null, dragOffset={x:0,y:0};
const defs={webhook:{title:'Webhook',type:'Trigger',icon:'↯',desc:'Receives JSON data from an external form or app.'},filter:{title:'Filter',type:'Logic',icon:'◇',desc:'Only continue when a condition is true.'},sheets:{title:'Google Sheets',type:'Action',icon:'▤',desc:'Append or update a spreadsheet row.'},email:{title:'Email',type:'Action',icon:'✉',desc:'Send a notification email.'},http:{title:'HTTP Request',type:'Action',icon:'↗',desc:'Call any REST API endpoint.'}};
function uid(){return Math.random().toString(36).slice(2,9)}
function addNode(kind,x=120+nodes.length*260,y=150){const n={id:uid(),kind,x,y,name:defs[kind].title,config:{}};nodes.push(n);render();select(n.id)}
function render(){canvas.querySelectorAll('.node').forEach(e=>e.remove());svg.innerHTML='';nodes.forEach(n=>{const d=defs[n.kind], el=document.createElement('div');el.className='node'+(selected===n.id?' selected':'');el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.innerHTML=`<div class="node-head"><div class="icon">${d.icon}</div><div><div class="node-title">${n.name}</div><div class="node-type">${d.type}</div></div></div><div class="node-body">${d.desc}</div>${n.kind!=='webhook'?'<div class="port in"></div>':''}<div class="port out"></div>`;el.addEventListener('mousedown',e=>startDrag(e,n));el.addEventListener('click',e=>{e.stopPropagation();select(n.id)});canvas.appendChild(el)});drawEdges()}
function drawEdges(){edges.forEach(e=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return;const x1=a.x+210,y1=a.y+52,x2=b.x,y2=b.y+52;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+80} ${y1}, ${x2-80} ${y2}, ${x2} ${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke','#8f86ff');path.setAttribute('stroke-width','3');path.setAttribute('stroke-linecap','round');svg.appendChild(path)})}
function select(id){selected=id;render();const n=nodes.find(x=>x.id===id);if(!n){inspector.innerHTML='<div class="empty">Select a module to configure it.</div>';return}let html=`<div class="field"><label>Module name</label><input id="cfgName" value="${escapeHtml(n.name)}"></div>`;if(n.kind==='webhook')html+=`<div class="field"><label>Webhook URL</label><input readonly value="/webhook/${n.id}"></div><div class="field"><label>Sample JSON</label><textarea id="sample">${escapeHtml(JSON.stringify(n.config.sample||{name:'Gokul',phone:'9876543210',city:'Chennai'},null,2))}</textarea></div>`;if(n.kind==='filter')html+=`<div class="field"><label>Condition</label><input id="condition" value="${escapeHtml(n.config.condition||'city == Chennai')}"></div><div class="hint">Educational evaluator: supports simple equality checks such as <b>city == Chennai</b>.</div>`;if(n.kind==='sheets')html+=`<div class="field"><label>Spreadsheet name</label><input id="sheet" value="${escapeHtml(n.config.sheet||'Leads')}"></div><div class="field"><label>Action</label><select id="sheetAction"><option>Append row</option><option>Update row</option></select></div>`;if(n.kind==='email')html+=`<div class="field"><label>Recipient</label><input id="to" value="${escapeHtml(n.config.to||'demo@example.com')}"></div><div class="field"><label>Subject</label><input id="subject" value="${escapeHtml(n.config.subject||'New lead received')}"></div>`;if(n.kind==='http')html+=`<div class="field"><label>Method</label><select id="method"><option>POST</option><option>GET</option></select></div><div class="field"><label>Endpoint URL</label><input id="url" placeholder="https://example.com/api"></div>`;html+=`<button class="btn primary" id="apply">Apply changes</button><button class="btn" id="delete" style="margin-left:6px">Delete</button>`;inspector.innerHTML=html;document.getElementById('apply').onclick=applyConfig;document.getElementById('delete').onclick=()=>{nodes=nodes.filter(x=>x.id!==id);edges=edges.filter(e=>e.a!==id&&e.b!==id);selected=null;render();select(null)}}
function applyConfig(){const n=nodes.find(x=>x.id===selected);if(!n)return;n.name=document.getElementById('cfgName').value||defs[n.kind].title;if(n.kind==='webhook')try{n.config.sample=JSON.parse(document.getElementById('sample').value)}catch{toast('Sample JSON is invalid');return}if(n.kind==='filter')n.config.condition=document.getElementById('condition').value;if(n.kind==='sheets'){n.config.sheet=document.getElementById('sheet').value;n.config.action=document.getElementById('sheetAction').value}if(n.kind==='email'){n.config.to=document.getElementById('to').value;n.config.subject=document.getElementById('subject').value}if(n.kind==='http'){n.config.method=document.getElementById('method').value;n.config.url=document.getElementById('url').value}render();toast('Module updated')}
function startDrag(e,n){if(e.target.classList.contains('port'))return;dragging=n;dragOffset={x:e.offsetX,y:e.offsetY};document.onmousemove=moveDrag;document.onmouseup=endDrag}
function moveDrag(e){if(!dragging)return;const r=canvas.getBoundingClientRect();dragging.x=Math.max(10,e.clientX-r.left-dragOffset.x);dragging.y=Math.max(10,e.clientY-r.top-dragOffset.y);render()}
function endDrag(){dragging=null;document.onmousemove=null;document.onmouseup=null}
canvas.addEventListener('click',e=>{if(e.target===canvas||e.target===svg){selected=null;render();select(null)}})
// Connect by clicking output port then input port
let linking=null;canvas.addEventListener('click',e=>{if(!e.target.classList.contains('port'))return;const id=e.target.closest('.node').dataset.id;if(e.target.classList.contains('out'))linking=id;else if(e.target.classList.contains('in')&&linking&&linking!==id){if(!edges.some(x=>x.a===linking&&x.b===id))edges.push({a:linking,b:id});linking=null;render();toast('Connection added')}});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addNode(b.dataset.add));
document.getElementById('newBtn').onclick=()=>{if(confirm('Start a new scenario?')){nodes=[];edges=[];selected=null;addNode('webhook',120,220);addNode('filter',430,220);addNode('sheets',740,220);addNode('email',1050,220);edges=[{a:nodes[0].id,b:nodes[1].id},{a:nodes[1].id,b:nodes[2].id},{a:nodes[2].id,b:nodes[3].id}];render();select(nodes[0].id)}};
document.getElementById('saveBtn').onclick=()=>{localStorage.setItem('flowforge',JSON.stringify({nodes,edges}));document.getElementById('status').textContent='Saved • '+new Date().toLocaleTimeString();toast('Scenario saved locally')};
document.getElementById('runBtn').onclick=run;
function run(){if(!nodes.length){toast('Add a module first');return}logs.innerHTML='';let data=(nodes.find(n=>n.kind==='webhook')?.config.sample)||{name:'Demo Lead',phone:'9000000000',city:'Chennai'};let ordered=topo();ordered.forEach((n,i)=>{let ok=true,msg='Executed successfully';if(n.kind==='filter'){const c=n.config.condition||'city == Chennai';const m=c.match(/^\s*([\w.]+)\s*==\s*(.+?)\s*$/);if(m){const val=m[1].split('.').reduce((o,k)=>o?.[k],data);const target=m[2].replace(/^['"]|['"]$/g,'');ok=String(val)===target;msg=ok?'Condition passed':'Condition failed — route stopped'}}if(n.kind==='http')msg='Simulation only: HTTP request '+(n.config.method||'POST');if(n.kind==='sheets')msg='Simulation only: '+(n.config.action||'Append row')+' to '+(n.config.sheet||'Leads');if(n.kind==='email')msg='Simulation only: email to '+(n.config.to||'demo@example.com');const item=document.createElement('div');item.className='log-item';item.innerHTML=`<b>${i+1}. ${escapeHtml(n.name)}</b><br><span class="${ok?'ok':'err'}">${ok?'✓':'✕'} ${escapeHtml(msg)}</span>`;logs.appendChild(item);if(!ok)return});toast('Scenario executed in demo mode')}
function topo(){const out=[],seen=new Set();let cur=nodes.find(n=>n.kind==='webhook')||nodes[0];while(cur&&!seen.has(cur.id)){seen.add(cur.id);out.push(cur);const e=edges.find(x=>x.a===cur.id);cur=e?nodes.find(n=>n.id===e.b):null}return out}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
(function init(){const saved=localStorage.getItem('flowforge');if(saved){try{({nodes,edges}=JSON.parse(saved))}catch{}}if(!nodes.length){nodes=[{id:uid(),kind:'webhook',x:120,y:220,name:'Website Form',config:{sample:{name:'Gokul',phone:'9876543210',city:'Chennai'}}},{id:uid(),kind:'filter',x:430,y:220,name:'Chennai Leads',config:{condition:'city == Chennai'}},{id:uid(),kind:'sheets',x:740,y:220,name:'Google Sheets',config:{sheet:'Leads',action:'Append row'}},{id:uid(),kind:'email',x:1050,y:220,name:'Notify Team',config:{to:'demo@example.com',subject:'New lead received'}}];edges=[{a:nodes[0].id,b:nodes[1].id},{a:nodes[1].id,b:nodes[2].id},{a:nodes[2].id,b:nodes[3].id}]};render()})();
</script></body></html>
